name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-15
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name PacketBridge launch.py
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/PacketBridge -DestinationPath PacketBridge-${{ matrix.label }}.zip
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/PacketBridge.app PacketBridge-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PacketBridge-${{ matrix.label }}
          path: PacketBridge-*.zip
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PacketBridge-*
          merge-multiple: true
          path: packages
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
        run: gh release create "$TAG" packages/*.zip --prerelease --title "PacketBridge $TAG" --notes "Experimental Windows host; Windows and macOS browser-client launcher. Native Packet Tracer compatibility requires manual validation. Packages are unsigned. A separately deployed HTTPS relay is required."
